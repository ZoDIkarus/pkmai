services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pkmai-trainer:local
    container_name: pkmai-trainer
    profiles: ["trainer"]
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./runtime:/app/runtime
      - ./local:/app/local:ro
    cpus: 1.5
    mem_limit: 1g
    memswap_limit: 2g
    restart: "no"

  web:
    image: pkmai-trainer:local
    container_name: pkmai-web
    profiles: ["web"]
    entrypoint: ["python", "-u", "src/web_stream.py"]
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "10.10.15.1:8001:8000"
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped

  cluster-master:
    image: pkmai-trainer:local
    container_name: pkmai-cluster-master
    profiles: ["cluster"]
    entrypoint: ["python", "-u", "src/cluster_master.py"]
    environment:
      PKMAI_CLUSTER_HOST: 10.10.15.1
      PKMAI_CLUSTER_PORT: "8765"
    volumes:
      - ./runtime:/app/runtime
    network_mode: host
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped

  cluster-brain:
    image: pkmai-trainer:local
    container_name: pkmai-cluster-brain
    profiles: ["cluster"]
    entrypoint: ["bash", "scripts/start_cluster_brain.sh"]
    environment:
      RAY_NODE_IP: 10.10.15.1
      PKMAI_CLUSTER_ENV_RUNNERS: "${PKMAI_CLUSTER_ENV_RUNNERS:-64}"
      PKMAI_CLUSTER_CHECKPOINT_EVERY: "10"
    volumes:
      - ./runtime:/app/runtime
      - ./local:/app/local:ro
    network_mode: host
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 3g
    shm_size: 768m
    restart: "no"

  cluster-worker:
    image: pkmai-trainer:local
    container_name: pkmai-cluster-worker
    profiles: ["cluster-local-worker"]
    entrypoint: ["bash", "scripts/start_cluster_worker.sh"]
    environment:
      RAY_ADDRESS: 10.10.15.1:6379
      RAY_NODE_IP: 10.10.15.1
      PKMAI_CLUSTER_MASTER_URL: http://10.10.15.1:8765
      PKMAI_CLUSTER_KEY_FILE: /app/runtime/cluster/cluster_key.txt
      PKMAI_WORKER_ID: ai-server-local-worker
      PKMAI_WORKER_AGENTS: "1"
    volumes:
      - ./runtime:/app/runtime:ro
      - ./local:/app/local:ro
    network_mode: host
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 2g
    shm_size: 512m
    restart: "no"
